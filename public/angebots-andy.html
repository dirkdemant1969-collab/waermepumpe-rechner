<style>
:root{
  --ground:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6;
  --ink:#15202E; --muted:#5B6675; --line:#D7DEE7;
  --primary:#1F3864; --primary-soft:#E4EAF4;
  --accent:#C0392B; --accent-soft:#F7E4E1;
  --positive:#2E6F52; --positive-soft:#E1EFE8;
  --shadow:0 1px 2px rgba(21,32,46,.06), 0 8px 24px rgba(21,32,46,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101620; --surface:#19202B; --surface-2:#212A37;
    --ink:#E6EBF2; --muted:#94A1B1; --line:#2E3947;
    --primary:#7CA0DE; --primary-soft:#1E2A3D;
    --accent:#E2705F; --accent-soft:#38231F;
    --positive:#63B58C; --positive-soft:#1B2F26;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#101620; --surface:#19202B; --surface-2:#212A37;
  --ink:#E6EBF2; --muted:#94A1B1; --line:#2E3947;
  --primary:#7CA0DE; --primary-soft:#1E2A3D;
  --accent:#E2705F; --accent-soft:#38231F;
  --positive:#63B58C; --positive-soft:#1B2F26;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.display{font-family:Archivo,"Segoe UI",system-ui,sans-serif; text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- Kopfleiste ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.bar-in{
  max-width:680px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:12px;
}
.bar img{height:30px; width:auto; border-radius:3px; flex:none}
.bar-t{flex:1; min-width:0}
.bar-t b{font-family:Archivo; font-size:15px; letter-spacing:-.01em; display:block}
.bar-t span{font-size:12px; color:var(--muted); display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rail{height:3px; background:var(--surface-2)}
.rail i{display:block; height:100%; background:var(--primary); width:0; transition:width .25s ease}

/* ---------- Grundgerüst ---------- */
main{max-width:680px; margin:0 auto; padding:20px 16px 96px}
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:20px; display:flex; flex-direction:column; gap:16px;
}
.eyebrow{
  font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted);
}
h1{font-size:24px; line-height:1.2; margin:0; letter-spacing:-.02em}
h2{font-size:19px; line-height:1.25; margin:0; letter-spacing:-.015em}
h3{font-size:14px; margin:0; letter-spacing:-.005em}
p{margin:0}
.hint{font-size:13px; color:var(--muted)}

/* ---------- Auswahlknöpfe ---------- */
.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:56px; padding:12px 14px; text-align:left;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-left:4px solid var(--line);
  border-radius:8px; cursor:pointer; font:inherit;
  transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--primary); border-left-color:var(--primary)}
.opt:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.opt[aria-pressed="true"]{
  border-color:var(--primary); border-left-color:var(--primary);
  background:var(--primary-soft);
}
.opt .k{
  flex:none; width:26px; height:26px; border-radius:6px;
  background:var(--surface-2); color:var(--muted);
  display:grid; place-items:center; font-size:12px; font-weight:600;
}
.opt[aria-pressed="true"] .k{background:var(--primary); color:#fff}
.opt .lbl{flex:1}
.opt .sub{display:block; font-size:12px; color:var(--muted); margin-top:1px}
/* ---------- Beratung ---------- */
.hero{
  background:var(--primary); color:#fff; border-radius:var(--radius);
  padding:26px 22px; display:flex; flex-direction:column; gap:10px;
}
.hero h1{font-size:27px; color:#fff}
.hero p{opacity:.9; font-size:15px}
.claim{
  display:flex; gap:10px; align-items:baseline; padding:14px 0;
  border-bottom:1px solid var(--line);
}
.claim:last-child{border-bottom:none}
.claim b{font-family:Archivo; font-size:15px; flex:none; min-width:0}
@media (max-width:560px){.claim{flex-direction:column; gap:3px}}
.claim span{font-size:14px; color:var(--muted)}
.haken{display:flex; flex-direction:column; gap:14px}
.haken h4{
  font-family:Archivo; font-size:13px; margin:0 0 4px; color:var(--primary);
  letter-spacing:.02em;
}
.haken ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px}
.haken li{font-size:14px; padding-left:22px; position:relative; line-height:1.4}
.haken li::before{
  content:"✓"; position:absolute; left:0; top:0;
  color:var(--positive); font-weight:700;
}
.fab{
  border:1px solid var(--line); border-left:4px solid var(--primary);
  border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px;
  background:var(--surface);
}
.fab .kopf{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.fab .kopf b{font-family:Archivo; font-size:17px; letter-spacing:-.01em}
.fab .kopf span{font-size:12px; color:var(--muted)}
.fab .ein{font-size:14px; font-style:italic; color:var(--muted)}
.fab ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px}
.fab li{font-size:13.5px; line-height:1.4}
.fab dl{
  display:grid; grid-template-columns:auto 1fr; gap:3px 14px;
  margin:0; font-size:12.5px; border-top:1px solid var(--line); padding-top:10px;
}
.fab dt{color:var(--muted)}
.fab dd{margin:0; text-align:right; font-variant-numeric:tabular-nums}
.fab .warn{
  font-size:12.5px; color:var(--accent); background:var(--accent-soft);
  padding:8px 10px; border-radius:6px;
}
.schritte{display:flex; gap:6px; margin-bottom:2px}
.schritte i{
  height:4px; flex:1; border-radius:2px; background:var(--surface-2);
}
.schritte i.an{background:var(--primary)}

td .sub{display:block; font-size:12px; color:var(--muted); margin-top:3px; line-height:1.35; font-weight:400}

/* ---------- Felder ---------- */
.fields{display:grid; gap:12px}
.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){.two{grid-template-columns:1fr}}
label{display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--muted)}
input{
  font:inherit; font-size:16px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:8px; padding:11px 12px; min-height:46px;
}
input:focus{outline:2px solid var(--primary); outline-offset:-1px; border-color:var(--primary)}

/* ---------- Aktionen ---------- */
.actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.btn{
  font:inherit; font-weight:600; font-size:15px; border-radius:8px;
  padding:12px 18px; min-height:48px; cursor:pointer; border:1px solid transparent;
}
.btn:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.btn.pri{background:var(--primary); color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface); color:var(--ink); border-color:var(--line)}
.btn.sec:hover{border-color:var(--primary)}
.btn.ghost{background:transparent; color:var(--muted); border-color:transparent; padding-left:4px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.spacer{flex:1}

/* ---------- Ergebnis ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:2px;
}
.tile.lead{background:var(--primary); border-color:var(--primary); color:#fff}
.tile .cap{font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85}
.tile .val{font-family:Archivo; font-size:29px; font-weight:700; letter-spacing:-.02em}
.tile .foot{font-size:12px; opacity:.8}

table{width:100%; border-collapse:collapse; font-size:14px}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
td.r,th.r{text-align:right; white-space:nowrap}
tr.sum td{font-weight:600; border-bottom:2px solid var(--primary)}
tr.grand td{font-family:Archivo; font-size:17px; font-weight:700; border-bottom:none}
.tnum{color:var(--muted); font-size:12px}
.pill{
  display:inline-block; font-size:10px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; padding:2px 7px; border-radius:99px; white-space:nowrap;
}
.pill.ev{background:var(--accent-soft); color:var(--accent)}
.pill.al{background:var(--surface-2); color:var(--muted)}

details{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
summary{
  padding:14px 16px; cursor:pointer; font-weight:600; font-size:14px;
  display:flex; align-items:center; gap:8px; list-style:none;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾"; margin-left:auto; color:var(--muted)}
details[open] summary::after{content:"▴"}
details .body{padding:0 16px 16px}

.intern{border-color:var(--positive)}
.intern summary{color:var(--positive)}
.kv{display:grid; grid-template-columns:1fr auto; gap:6px 16px; font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{text-align:right; font-weight:600}

.note{
  font-size:13px; padding:12px 14px; border-radius:8px;
  background:var(--surface-2); color:var(--muted);
}
.note.warn{background:var(--accent-soft); color:var(--accent); font-weight:500}
.stack{display:flex; flex-direction:column; gap:16px}
.hide{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="bar">
  <div class="bar-in">
    <img id="logo" alt="Dirk Demant Heizung Sanitär Solar">
    <div class="bar-t"><b>Angebots Andy</b><span id="barsub">Aufnahme beim Kunden</span></div>
  </div>

/* =========================================================
   Auswahllogik - identisch zu tools/andy.py
   ========================================================= */
const JA = ["ja","j","yes","true"];
const UNKLAR = ["unklar","vielleicht","eventuell","?"];
const norm = v => typeof v === "string" ? v.trim().toLowerCase() : v;
const istJa = v => (typeof v === "number") ? v > 0 : JA.includes(norm(v));
const istUnklar = v => UNKLAR.includes(norm(v));

function trifftZu(pos, ant){
  const regel = pos.wann || "immer";
  if (regel === "immer") return true;
  if (regel.startsWith("frage:")){
    const w = ant[regel.slice(6)];
    return istJa(w) || istUnklar(w);
  }
  const i = regel.indexOf(":");
  const id = regel.slice(0, i), erwartet = regel.slice(i + 1);
  const gegeben = ant[id];
  if (gegeben === undefined || gegeben === "") return false;
  if (erwartet.startsWith("nicht ")) return norm(gegeben) !== norm(erwartet.slice(6));
  return norm(gegeben) === norm(erwartet);
}

function einzelpreis(p){
  const teile = (p.mat_vk || 0) + (p.lohn_vk || 0) + (p.sonst_vk || 0);
  return teile || (p.preis || 0);
}

function baueAngebot(liste, ant){
  const titel = [], warnungen = [];
  for (const t of liste.titel){
    const gewaehlt = [];
    for (const pos of t.positionen){
      if (!trifftZu(pos, ant)) continue;
      let art = pos.art || "normal";
      const regel = pos.wann || "immer";
      const jaNein = regel.startsWith("frage:");
      if (art === "provis" && jaNein){
        const a = ant[regel.slice(6)];
        if (istUnklar(a)) art = "provis";
        else if (istJa(a)) art = "normal";
        else continue;
      } else if ((art === "provis" || art === "alternate") && !jaNein){
        art = "normal";
      }
      let menge = pos.menge || 1;
      if (pos.menge_aus_frage){
        menge = parseFloat(ant[pos.menge_aus_frage]) || 0;
        if (menge <= 0) continue;
      }
      gewaehlt.push({...pos, art, menge, einzel: einzelpreis(pos)});
    }
    if (!gewaehlt.length) continue;
    if (t.auswahl === "genau_eine"){
      const echte = gewaehlt.filter(p => p.art === "normal" &&
        (!t.auswahl_frage || (p.wann || "").startsWith(t.auswahl_frage + ":")));
      if (echte.length !== 1)
        warnungen.push(`Titel ${t.nr} (${t.name}): ${echte.length} Positionen gewählt, erwartet war genau eine.`);
    }
    const summe = gewaehlt.reduce((s,p) => s + (p.art === "normal" ? p.einzel * p.menge : 0), 0);
    titel.push({nr:t.nr, name:t.name, positionen:gewaehlt, summe});
  }
  const netto = titel.reduce((s,t) => s + t.summe, 0);
  let einkauf = 0, lohnkosten = 0, minuten = 0;
  for (const t of titel) for (const p of t.positionen){
    if (p.art !== "normal") continue;
    einkauf += ((p.mat_ek || 0) + (p.sonst_ek || 0)) * p.menge;
    lohnkosten += (p.lohn_ek || 0) * p.menge;
    minuten += (p.lohn_min || 0) * p.menge;
  }
  return {titel, netto, ust:netto*0.19, brutto:netto*1.19,
          einkauf, lohnkosten, db:netto-einkauf-lohnkosten, minuten, warnungen};
}

/* =========================================================
   Vergleich der Fabrikate - spiegelt tools/vergleich.py
   ========================================================= */
const GEMEINSAM = ["oeltank","puffer","zirkulation","thermostatventile","heizkoerper",
  "fussbodenverteiler","elektro","leitungsfuehrung","fundament","wasserhaerte","fuellstrecke"];

const frageVon = (liste, id) => (liste.fragen || []).find(f => f.id === id) || null;

function heizlastErmitteln(liste, ant){
  const e = ZUORDNUNG.geraete[liste.hersteller] || {};
  const modelle = e.modelle || [];
  if (!modelle.length) return null;
  if (!e.frage) return modelle[0].kw;
  const treffer = modelle.find(m => String(m.wert) === String(ant[e.frage]));
  return treffer ? treffer.kw : null;
}

function modellFuer(liste, kw){
  const e = ZUORDNUNG.geraete[liste.hersteller] || {};
  const modelle = (e.modelle || []).slice().sort((a,b) => a.kw - b.kw);
  if (!modelle.length)
    return [null, "Gerätezuordnung fehlt — noch nicht hinterlegt."];
  const passend = modelle.find(m => m.kw >= kw);
  if (passend) return [passend, null];
  const groesstes = modelle[modelle.length - 1];
  return [groesstes, `Größtes Gerät hat nur ${groesstes.kw} kW und deckt die gesuchten ${kw} kW nicht ab.`];
}

function warmwasserFuer(liste, gewaehlt){
  const frage = frageVon(liste, "warmwasser");
  if (!frage) return [null, null];
  if (frage.optionen.includes(gewaehlt)) return [gewaehlt, null];
  const hersteller = (liste.hersteller || "").toLowerCase();
  for (const gruppe of ZUORDNUNG.warmwasser.gruppen){
    if (!gruppe.optionen.includes(gewaehlt)) continue;
    const da = gruppe.optionen.filter(k => frage.optionen.includes(k));
    if (!da.length) continue;
    const eigene = da.filter(k => hersteller && k.toLowerCase().includes(hersteller));
    const k = (eigene.length ? eigene : da)[0];
    return [k, `Speicher ersetzt durch ${k} (${gruppe.name}).`];
  }
  return [frage.optionen[0], `Speicher nicht vergleichbar, ersatzweise ${frage.optionen[0]}.`];
}

function uebertrage(ziel, ant, kw){
  const neu = {}, hinweise = [];
  for (const frage of ziel.fragen || []){
    if (!GEMEINSAM.includes(frage.id) || !(frage.id in ant)) continue;
    const wert = ant[frage.id];
    if (frage.optionen && !frage.optionen.includes(wert)) continue;
    neu[frage.id] = wert;
  }
  const e = ZUORDNUNG.geraete[ziel.hersteller] || {};
  const [modell, warnung] = modellFuer(ziel, kw);
  if (!modell) return [null, [warnung]];
  if (warnung) hinweise.push(warnung);
  if (e.frage && modell.wert != null) neu[e.frage] = modell.wert;

  if ("warmwasser" in ant){
    const [wert, hinweis] = warmwasserFuer(ziel, ant.warmwasser);
    if (wert != null) neu.warmwasser = wert;
    if (hinweis) hinweise.push(hinweis);
  }
  if ("heizkreise" in ant){
    const frage = frageVon(ziel, "heizkreise"), wert = ant.heizkreise;
    if (frage){
      if (frage.optionen.includes(wert)) neu.heizkreise = wert;
      else {
        const ersatz = ZUORDNUNG.heizkreise.ersatz[wert];
        if (ersatz && frage.optionen.includes(ersatz)){
          neu.heizkreise = ersatz;
          hinweise.push(`Heizkreisgruppe: „${wert}“ wird hier zu „${ersatz}“, weil dieses Fabrikat keine Gruppe im Gerät mitbringt.`);
        } else {
          neu.heizkreise = frage.optionen[0];
          hinweise.push(`Heizkreisgruppe ersatzweise „${frage.optionen[0]}“.`);
        }
      }
    }
  }
  const offen = (ziel.fragen || []).filter(f =>
    !(f.id in neu) && f.id !== "warmwasser" && f.id !== "heizkreise").length;
  if (offen) hinweise.push(`Ohne fabrikatspezifisches Zubehör (${offen} Frage${offen === 1 ? "" : "n"} nicht übertragbar).`);
  return [neu, hinweise];
}

function vergleiche(quelle, ant){
  const kw = heizlastErmitteln(quelle, ant);
  if (kw == null) return null;
  const zeilen = [];
  for (const ziel of STUECKLISTEN){
    const eigen = ziel.hersteller === quelle.hersteller;
    let a = ant, hinweise = [];
    if (!eigen){
      const [uebertragen, h] = uebertrage(ziel, ant, kw);
      if (!uebertragen){
        zeilen.push({hersteller:ziel.hersteller, eigen:false, netto:null, geraet:null, hinweise:h});
        continue;
      }
      a = uebertragen; hinweise = h;
    }
    const e = baueAngebot(ziel, a);
    const [modell] = modellFuer(ziel, kw);
    zeilen.push({hersteller:ziel.hersteller, eigen, geraet:(modell || {}).bezeichnung,
                 netto:e.netto, hinweise});
  }
  zeilen.sort((a,b) => (a.eigen ? 0 : 1) - (b.eigen ? 0 : 1)
    || (a.netto == null) - (b.netto == null) || (a.netto || 0) - (b.netto || 0));
  return {kw, zeilen};
}

        <span class="val num">${e.titel.reduce((s,t)=>s+t.positionen.length,0)}</span>
        <span class="foot">Positionen in ${e.titel.length} Titeln</span></div>
    </div>

    <div class="card">
      <h3>Titel-Zusammenstellung</h3>
      <table><tbody>${zeilen}
        <tr class="sum"><td>Netto-Summe</td><td class="r num">${eur(e.netto)}</td></tr>
        <tr><td>19,00 % USt.</td><td class="r num">${eur(e.ust)}</td></tr>
        <tr class="grand"><td>Gesamt-Betrag</td><td class="r num">${eur(e.brutto)}</td></tr>
      </tbody></table>
      <p class="hint">Eventualpositionen sind in der Summe nicht enthalten.</p>
    </div>

    ${vergleichsKarte()}

    <details><summary>Alle Positionen anzeigen</summary>
      <div class="body scroll"><table>
        <thead><tr><th>Position</th><th class="r">Menge</th>
          <th class="r">E-Preis</th><th class="r">G-Preis</th></tr></thead>
        <tbody>${pos}</tbody></table></div></details>

    <details class="intern"><summary>Interne Zahlen — nicht für den Kunden</summary>
      <div class="body"><div class="kv">
        <span class="k">Material und Fremdleistung</span><span class="v num">${eur(e.einkauf)} €</span>
        <span class="k">Lohnkosten</span><span class="v num">${eur(e.lohnkosten)} €</span>
        <span class="k">Deckungsbeitrag</span><span class="v num">${eur(e.db)} €${
          e.netto ? ` (${(e.db/e.netto*100).toFixed(1)} %)` : ""}</span>
        <span class="k">Monteurzeit</span><span class="v num">${(e.minuten/60).toFixed(1)} Std.</span>
      </div></div></details>

    <div class="card">
      <h3>Förderung und Betriebskosten</h3>
      <p class="hint">Öffnet unseren Rechner mit der Angebotssumme von
        ${eur(e.brutto)} € — Sie müssen nichts abtippen.</p>
      <div class="actions">
        <a class="btn sec" target="_blank" rel="noopener"
           href="${esc(BERATUNG.rechner_url)}?invest=${Math.round(e.brutto)}">
          KfW-Förderung und Ersparnis rechnen</a>
      </div>
      <p class="hint">Braucht eine Internetverbindung.</p>
    </div>

    <div class="card">
      <h3>Weitergeben</h3>
      <div class="actions">
        <button class="btn pri" data-akt="pdf">Angebot als PDF</button>
        <button class="btn sec" data-akt="aufnahme">Aufnahme sichern</button>
      </div>
      <p class="hint" id="dlstatus">Das PDF ist zum Mitgeben. Die Aufnahme-Datei
        brauchst du im Büro, um daraus die TAIFUN-Datei zu erzeugen.</p>
    </div>

    <div class="actions">
      <button class="btn ghost" data-akt="zurueck">← Antworten ändern</button>
      <div class="spacer"></div>
      <button class="btn sec" data-akt="neu">Neue Aufnahme</button>
    </div>
  </div>`;
}

/* =========================================================
   Bedienung
   ========================================================= */
function binde(){
  app.querySelectorAll("[data-akt]").forEach(el =>
    el.addEventListener("click", () => handle(el.dataset.akt, el)));
  const ersteEingabe = app.querySelector("input");
  if (ersteEingabe && S.schritt === "kunde") ersteEingabe.focus();
  // Kommt man aus der Beratung zurueck, ist die Fabrikatwahl schon aufgeklappt
  const wahl = document.getElementById("fabrikatwahl");
  if (wahl && S.beratungsSeite > 0) wahl.classList.remove("hide");
}

function handle(akt, el){
  if (akt === "beratung-start"){ S.schritt = "beratung"; S.beratungsSeite = 0; }
  else if (akt === "direkt"){
    document.getElementById("fabrikatwahl").classList.remove("hide");
    document.getElementById("fabrikatwahl").scrollIntoView({behavior:"smooth"});
    return;
  }
  else if (akt === "beratung-weiter"){ S.beratungsSeite++; }
  else if (akt === "beratung-zurueck"){
    if (S.beratungsSeite === 0) S.schritt = "start";
    else S.beratungsSeite--;
  }
  else if (akt === "zur-aufnahme"){ S.schritt = "start"; }
  else if (akt === "fabrikat"){
    S.liste = STUECKLISTEN[+el.dataset.i];
    S.ant = {}; S.frageNr = 0; S.schritt = "kunde";
  }
  else if (akt === "kunde-weiter"){
    const v = id => document.getElementById(id).value.trim();
    S.kunde = {name:v("f_name"), anrede:v("f_anrede"), strasse:v("f_str"),
               plz:v("f_plz"), ort:v("f_ort"), telefon:v("f_tel"),
               email:v("f_mail"), nummer:v("f_knr")};
    S.kopf = {nummer:v("f_anr"),
              projekt:v("f_proj") || `Wärmepumpe ${v("f_str")}, ${v("f_ort")}`.trim()};
    S.schritt = "fragen"; S.frageNr = 0;
  }
  else if (akt === "antwort"){
    const q = S.liste.fragen[S.frageNr];
    S.ant[q.id] = el.dataset.wert;
    if (S.frageNr < S.liste.fragen.length - 1) S.frageNr++;
    else { S.ergebnis = baueAngebot(S.liste, S.ant); S.schritt = "ergebnis"; }
  }
  else if (akt === "zahl-weiter"){
    const q = S.liste.fragen[S.frageNr];
    S.ant[q.id] = parseFloat(document.getElementById("f_zahl").value) || 0;
    if (S.frageNr < S.liste.fragen.length - 1) S.frageNr++;
    else { S.ergebnis = baueAngebot(S.liste, S.ant); S.schritt = "ergebnis"; }
  }
  else if (akt === "rechnen"){
    S.ergebnis = baueAngebot(S.liste, S.ant); S.schritt = "ergebnis";
  }
  else if (akt === "zurueck"){
    if (S.schritt === "kunde") S.schritt = "start";
    else if (S.schritt === "ergebnis"){ S.schritt = "fragen"; S.frageNr = S.liste.fragen.length - 1; }
    else if (S.frageNr > 0) S.frageNr--;
    else S.schritt = "kunde";
  }
  else if (akt === "neu"){
    Object.assign(S, {schritt:"start", liste:null, kunde:{}, kopf:{}, ant:{}, frageNr:0, ergebnis:null});
  }
  else if (akt === "pdf"){ pdfSpeichern(el); return; }
  else if (akt === "aufnahme"){ aufnahmeSpeichern(el); return; }
  zeichne();
}

document.addEventListener("keydown", ev => {
  if (S.schritt !== "fragen" || ev.metaKey || ev.ctrlKey) return;
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const knoepfe = [...app.querySelectorAll('[data-akt="antwort"]')];
  const n = parseInt(ev.key, 10);
  if (knoepfe.length && n >= 1 && n <= knoepfe.length){ knoepfe[n-1].click(); ev.preventDefault(); }
});

/* =========================================================
   Dateien weitergeben
   ========================================================= */
let downloads = null;
// Ausserhalb der Artifact-Umgebung (z.B. lokal geoeffnet) gibt es claude nicht.
if (typeof claude !== "undefined" && claude.use)
  claude.use("downloads").then(d => { downloads = d; }).catch(() => {});

function status(text, warnend){
  const el = document.getElementById("dlstatus");
  if (!el) return;
  el.textContent = text;
  el.style.color = warnend ? "var(--accent)" : "";
}

const imArtifact = typeof claude !== "undefined";

function browserDownload(dateiname, daten){
  const blob = daten instanceof Blob ? daten : new Blob([daten]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = dateiname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function anbieten(dateiname, daten, knopf){
  // Als gespeicherte Datei geoeffnet (Keller, kein Netz): normaler Browser-Download
  if (!imArtifact){
    browserDownload(dateiname, daten);
    status(`${dateiname} gespeichert.`);
    return;
  }
  if (!downloads){
    status("Speichern ist in dieser Ansicht noch nicht bereit. Kurz warten und nochmal tippen.", true);
    return;
  }
  knopf.disabled = true;
  try{
    await downloads.save({filename:dateiname, data:daten});
    status(`${dateiname} gespeichert.`);
  } catch (fehler){
    const c = fehler && fehler.code;
    status(c === "declined" ? "Speichern abgebrochen."
         : c === "too_large" ? "Die Datei ist zu groß."
         : `Speichern nicht möglich (${c || "unbekannt"}).`, true);
  } finally { knopf.disabled = false; }
}

function dateiname(endung){
  const nr = (S.kopf.nummer || "Angebot").replace(/[^A-Za-z0-9_-]/g, "");
  return `${nr || "Angebot"}.${endung}`;
}

function aufnahmeSpeichern(knopf){
  const inhalt = {
    _hinweis: "Aufnahme aus der Weboberflaeche. Mit tools/andy.py weiterverarbeiten.",
    fabrikat: S.liste.hersteller, stueckliste: S.liste.name,
    projektname: S.kopf.projekt, angebotsnummer: S.kopf.nummer,
    kunde: S.kunde, ...S.ant
  };
  anbieten(dateiname("json").replace(".json", "_aufnahme.json"),
           JSON.stringify(inhalt, null, 2), knopf);
}

/* ---------- PDF ---------- */
function pdfSpeichern(knopf){
  const {jsPDF} = window.jspdf || {};
  if (!jsPDF){ status("Die PDF-Bibliothek ist nicht geladen. Seite neu laden.", true); return; }
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const B = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const L = 20, R = B - 18;
  const e = S.ergebnis;

  const fuss = () => {
    const y = H - 20;
    doc.setDrawColor(150); doc.setLineWidth(0.2); doc.line(L, y, R, y);
    doc.setFontSize(6.2); doc.setTextColor(110);
    const sp = [[L, ["Anschrift", FIRMA.name, "Inhaber: " + FIRMA.inhaber,
                     FIRMA.strasse + ", " + FIRMA.plz_ort]],
                [L + 62, ["Kommunikation", "Telefon " + FIRMA.telefon,
                          "eMail " + FIRMA.email, "Internet " + FIRMA.internet]],
                [L + 118, ["Bankverbindung", FIRMA.bank, "IBAN: " + FIRMA.iban,
                           "BIC: " + FIRMA.bic]]];
    sp.forEach(([x, zeilen]) => zeilen.forEach((z,i) => {
      doc.setFont("helvetica", i ? "normal" : "bold");
      doc.text(z, x, y + 4 + i * 2.6);
    }));
    doc.setFont("helvetica", "normal");
    doc.text("Seite " + doc.internal.getNumberOfPages(), B/2, H - 6, {align:"center"});
    doc.setTextColor(0);
  };

  // Kopf
  try { doc.addImage(LOGO, "PNG", R - 46, 10, 46, 30); } catch (_) {}
  doc.setFontSize(6.5); doc.setTextColor(110);
  doc.text(FIRMA.absenderzeile, L, 46);
  doc.setTextColor(0); doc.setFontSize(11);
  const adr = [S.kunde.name, S.kunde.strasse,
               [S.kunde.plz, S.kunde.ort].filter(Boolean).join(" ")].filter(Boolean);
  adr.forEach((z,i) => doc.text(z, L, 53 + i * 5.5));

  doc.setFontSize(8.5);
  const heute = new Date().toLocaleDateString("de-DE");
  const kopf = [["Angebots-Nr.", S.kopf.nummer], ["Datum", heute],
                ["Kunden-Nr.", S.kunde.nummer], ["USt-ID.", FIRMA.ust_id],
                ["Steuer-Nr.", FIRMA.steuer_nr]].filter(z => z[1]);
  kopf.forEach(([k,v], i) => {
    doc.setFont("helvetica", "normal"); doc.text(k + ":", R - 62, 47 + i * 5);
    doc.setFont("helvetica", "bold");   doc.text(String(v), R - 34, 47 + i * 5);
  });

  doc.setFont("helvetica", "bold"); doc.setFontSize(15);
  doc.setTextColor(31, 56, 100);
  doc.text("A N G E B O T", L, 82);
  doc.setTextColor(0); doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
  doc.text(S.kunde.anrede || FIRMA.anrede_standard, L, 92);
  doc.text(FIRMA.einleitung, L, 98);
  doc.setFont("helvetica", "bold");
  doc.text(doc.splitTextToSize(S.kopf.projekt || "", R - L), L, 105);

  // Positionen
  const koerper = [];
  e.titel.forEach(t => {
    koerper.push([{content:`Titel ${t.nr}: ${t.name}`, colSpan:6,
                   styles:{fontStyle:"bold", textColor:[31,56,100], fillColor:[237,241,246]}}]);
    t.positionen.forEach(p => {
      const kz = p.art === "provis" ? "Eventual" : p.art === "alternate" ? "Alternativ" : "";
      koerper.push([p.nr, mng(p.menge), einh(p.einheit),
                    (p.langtext || p.text) + "\nLiefern und montieren",
                    eur(p.einzel), kz || eur(p.einzel * p.menge)]);
    });
    koerper.push([{content:`Titel ${t.nr}: ${t.name}`, colSpan:5,
                   styles:{fontStyle:"bold", halign:"left"}},
                  {content:eur(t.summe), styles:{fontStyle:"bold", halign:"right"}}]);
  });

  doc.autoTable({
    startY: 112, margin:{left:L, right:18, bottom:28, top:28},
    head: [["Position","Menge","Einh.","Bezeichnung","E-Preis","G-Preis"]],
    body: koerper,
    styles:{font:"helvetica", fontSize:7.5, cellPadding:1.6, overflow:"linebreak",
            lineColor:[215,222,231], lineWidth:0.1, textColor:[21,32,46]},
    headStyles:{fillColor:[255,255,255], textColor:[31,56,100], fontStyle:"bold",
                lineWidth:{bottom:0.4}, lineColor:[31,56,100]},
    columnStyles:{0:{cellWidth:14}, 1:{cellWidth:13, halign:"right"},
                  2:{cellWidth:11}, 3:{cellWidth:"auto"},
                  4:{cellWidth:20, halign:"right"}, 5:{cellWidth:20, halign:"right"}},
    didDrawPage: fuss
  });

  // Summen
  let y = doc.lastAutoTable.finalY + 8;
  const zeile = (k, v, fett, gross) => {
    if (y > H - 40){ doc.addPage(); fuss(); y = 30; }
    doc.setFont("helvetica", fett ? "bold" : "normal");
    doc.setFontSize(gross ? 11 : 9);
    doc.text(k, L, y); doc.text(v, R, y, {align:"right"});
    y += gross ? 7 : 5.5;
  };
  doc.setFont("helvetica", "bold"); doc.setFontSize(9);
  if (y > H - 60){ doc.addPage(); fuss(); y = 30; }
  doc.text("Titel-Zusammenstellung", L, y); y += 6;
  e.titel.forEach(t => zeile(`Titel ${t.nr}: ${t.name}`, eur(t.summe)));
  y += 1.5; doc.setDrawColor(31,56,100); doc.line(L, y - 3, R, y - 3);
  zeile("Netto-Summe €", eur(e.netto), true);
  zeile("19,00 % USt. €", eur(e.ust));
  zeile("Gesamt-Betrag €", eur(e.brutto), true, true);

  // Schlusstexte
  y += 4; doc.setFontSize(7.5); doc.setFont("helvetica", "normal");
  const absatz = txt => {
    const zeilen = doc.splitTextToSize(txt, R - L);
    if (y + zeilen.length * 3.4 > H - 32){ doc.addPage(); fuss(); y = 30; }
    doc.text(zeilen, L, y); y += zeilen.length * 3.4 + 2.2;
  };
  (FIRMA.schlussbloecke || []).forEach(absatz);
  doc.setFont("helvetica", "bold"); absatz(FIRMA.anlagenhinweis || "");
  doc.setFont("helvetica", "normal");
  y += 3;
  if (y > H - 55){ doc.addPage(); fuss(); y = 30; }
  doc.setFontSize(9.5);
  doc.text(FIRMA.gruss, L, y); y += 6;
  doc.text(FIRMA.unterschrift, L, y); y += 10;
  doc.setFontSize(7.5);
  absatz(FIRMA.auftragshinweis || "");
  y += 10;
  doc.setDrawColor(120);
  doc.line(L, y, L + 60, y); doc.line(L + 80, y, L + 140, y);
  doc.setFontSize(6.5); doc.setTextColor(110);
  doc.text("Ort, Datum", L, y + 4); doc.text("Unterschrift", L + 80, y + 4);

  anbieten(dateiname("pdf"), doc.output("arraybuffer"), knopf);
}

zeichne();
</script>
